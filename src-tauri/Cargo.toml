[package]
name = "goo"
version = "0.3.1"
description = "goo: a small, local-first Markdown editor"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.90"

[lib]
# `_lib` suffix: avoids a name clash with the binary on Windows (cargo#8519).
name = "goo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
goo-core = { path = "../crates/goo-core" }
goo-mcp = { path = "../crates/goo-mcp" }
goo-sync = { path = "../crates/goo-sync" }
# notices changes made outside goo in the open folder
notify-debouncer-mini = "0.7"
# goo cloud tokens live in the OS keychain (macOS Keychain, Windows Credential Manager, Secret Service on Linux)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
# A second "Open with goo" hands its file to the running window instead of starting another app.
tauri-plugin-single-instance = "2"

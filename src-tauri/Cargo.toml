[package]
name = "goo"
version = "0.1.0"
description = "goo: a small, local-first Markdown editor"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.90"

[lib]
# `_lib` suffix: avoids a name clash with the binary on Windows (cargo#8519).
name = "goo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
goo-core = { path = "../crates/goo-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

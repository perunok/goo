[package]
name = "goo-core"
version = "0.1.0"
description = "goo's file logic: workspace tree, path guarding, atomic writes. No Tauri dependency, so it is unit-tested on its own."
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

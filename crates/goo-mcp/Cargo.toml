[package]
name = "goo-mcp"
version = "0.1.0"
description = "goo's MCP server: note tools for AI assistants, a localhost Streamable-HTTP endpoint and the stdio bridge clients launch. No Tauri dependency."
edition = "2021"
license = "MIT"
publish = false

[dependencies]
goo-core = { path = "../goo-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# plain HTTP to 127.0.0.1 only: no TLS needed
ureq = { version = "3", default-features = false }
getrandom = "0.3"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[package]
name = "goo-sync"
version = "0.1.0"
description = "goo's desktop sync engine for goo cloud: wire types, HTTP client with token refresh, folder scan, 3-way merge and the pull/push cycle. No Tauri dependency."
edition = "2021"
license = "MIT"
publish = false

[dependencies]
goo-core = { path = "../goo-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTPS to the goo cloud server (rustls + webpki roots, the crate's default features)
ureq = "3"
diffy = "0.5"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# NFC, so paths compare like the server's pathKey (macOS may report NFD names)
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

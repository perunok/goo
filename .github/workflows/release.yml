name: Release

# Builds goo's installers on every desktop platform:
#   Linux x64 + arm64   .deb, .rpm, .AppImage
#   macOS Apple silicon + Intel   .dmg
#   Windows x64   setup .exe (NSIS) and .msi
#
# - Push a tag `vX.Y.Z` (matching package.json) -> a draft GitHub release with every installer attached.
#   Review it on GitHub and press Publish.
# - Run it by hand (Actions > Release > Run workflow) -> the same builds as workflow artifacts only, no release.
#
# Builds are unsigned: macOS gets an ad-hoc signature (bundle.macOS.signingIdentity "-" in tauri.conf.json), so
# Apple silicon opens it after the "unidentified developer" prompt; Windows shows SmartScreen. To sign later, add the
# APPLE_* / Windows signing secrets described in https://v2.tauri.app/distribute/sign/ and pass them as env below.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04 # oldest supported glibc, so the AppImage/deb run on more distros
            args: ''
          - name: linux-arm64
            os: ubuntu-22.04-arm
            args: ''
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            args: ''
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

      - run: npm ci

      - name: Build (and attach to the draft release on tags)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: goo ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your system below.

            - **Linux**: `.AppImage` (any distro: `chmod +x` and run), `.deb` (Debian/Ubuntu), `.rpm` (Fedora/openSUSE)
            - **macOS**: `.dmg` (`aarch64` = Apple silicon, `x64` = Intel). Unsigned: right-click the app > Open the first time.
            - **Windows**: `-setup.exe` or `.msi`. Unsigned: SmartScreen > More info > Run anyway.
          releaseDraft: true
          generateReleaseNotes: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: goo-[version]-${{ matrix.name }}-[bundle]

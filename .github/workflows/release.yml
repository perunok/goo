name: Release

# Builds goo's installers on every desktop platform, named like Slinger's (scripts/release-assets.mjs):
#   goo-<version>-linux-amd64.deb / -linux-arm64.deb, -linux-x86_64.AppImage / -linux-aarch64.AppImage,
#   -linux-x86_64.rpm / -linux-aarch64.rpm, -mac-arm64.dmg / -mac-x64.dmg, -win-x64.exe / -win-x64.msi
#
# - Push a tag `vX.Y.Z` (matching package.json) -> a draft GitHub release with every installer attached.
#   Review it on GitHub and press Publish.
# - Run it by hand (Actions > Release > Run workflow) -> the same installers as workflow artifacts only, no release.
#
# Builds are unsigned: macOS gets an ad-hoc signature (bundle.macOS.signingIdentity "-" in tauri.conf.json), so
# Apple silicon opens it after the "unidentified developer" prompt; Windows shows SmartScreen. To sign later, add the
# APPLE_* / Windows signing secrets described in https://v2.tauri.app/distribute/sign/ and pass them as env below.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04 # oldest supported glibc, so the AppImage/deb run on more distros
            args: ''
          - name: linux-arm64
            os: ubuntu-22.04-arm
            args: ''
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            args: ''
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

      - run: npm ci

      - name: Build
        shell: bash
        run: npx tauri build ${{ matrix.args }}

      - name: Name the installers
        shell: bash
        run: node scripts/release-assets.mjs ${{ matrix.name }} release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: goo-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Draft release with every installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l release-assets
          cat > notes.md <<'EOF'
          Download the installer for your system below.

          - **Linux**: `.AppImage` (any distro: `chmod +x` and run), `.deb` (Debian/Ubuntu), `.rpm` (Fedora/openSUSE); `amd64`/`x86_64` = Intel/AMD, `arm64`/`aarch64` = ARM
            The Linux package and command are called `goo-notes` (Ubuntu's unrelated `goo` package is a programming language).
          - **macOS**: `.dmg` (`arm64` = Apple silicon, `x64` = Intel). Unsigned: right-click the app > Open the first time.
          - **Windows**: `.exe` (installer) or `.msi`. Unsigned: SmartScreen > More info > Run anyway.
          EOF
          gh release create "$GITHUB_REF_NAME" release-assets/* --draft --title "goo $GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag
